<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Viktor Kozak — Photographe</title>
  <meta name="description" content="Viktor Kozak, photographe — moto, hiver polonais, campagne, animaux et architecture. Portfolio et contact.">
  <meta name="color-scheme" content="light only">
  <meta property="og:title" content="Viktor Kozak — Photographe">
  <meta property="og:description" content="Viktor Kozak, photographe — moto, hiver polonais, campagne, animaux et architecture.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- fond : mot STUDIO sur toute la largeur, en bas -->
  <svg class="bgword" fill="#f6f6f6" viewBox="0 -14 600 118" preserveAspectRatio="none" aria-hidden="true">
    <text x="0" y="100" textLength="600" lengthAdjust="spacingAndGlyphs">STUDIO</text>
  </svg>
  <header class="bar bar--top">
    <span class="brand">Viktor Kozak</span>
    <div class="contact">
      <span class="contact__title">Contact</span>
      <ul class="contact__list">
        <li><a class="link" href="tel:+33762348399">+33 7 62 34 83 99</a></li>
        <li><a class="link" href="mailto:viktorkozakstudio@gmail.com">viktorkozakstudio@gmail.com</a></li>
        <li><a class="link swap-link" href="https://instagram.com/vikazok" target="_blank" rel="noopener" aria-label="Instagram @vikazok"><span>Instagram</span><span>@vikazok</span></a></li>
      </ul>
    </div>
  </header>

  <!-- gauche : liste des projets (actif en gras) -->
  <nav class="plist" id="plist" aria-label="Projets"></nav>

  <!-- droite : bascule LIST / GALLERY -->
  <div class="viewtog" role="group" aria-label="Affichage">
    <button type="button" class="on" data-view="list">List</button>
    <button type="button" data-view="gallery">Gallery</button>
  </div>

  <div class="gallery" id="gallery">
    <svg class="bgword" fill="#f6f6f6" viewBox="0 -14 600 118" preserveAspectRatio="none" aria-hidden="true">
      <text x="0" y="100" textLength="600" lengthAdjust="spacingAndGlyphs">STUDIO</text>
    </svg>
  </div>

  <main class="stage" aria-roledescription="carrousel" aria-label="Projets">
    <ul class="track" id="track"></ul>

    <div class="caption">
      <span class="count" id="count">01/06</span>
      <h1 class="title" id="title"></h1>
    </div>
    <span class="num" id="num"></span>
    <div class="meta">
      <span class="cat" id="cat"></span>
      <span class="year" id="year"></span>
    </div>
  </main>

  <footer class="bar bar--bottom">
    <span class="credit">© 2026 Viktor Kozak — Tous droits réservés</span>
  </footer>

  <!-- visionneuse plein écran (clic sur une photo en vue List) -->
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Visionneuse" aria-hidden="true">
    <div class="lb__top">
      <span class="lb__count" id="lbCount"></span>
      <button type="button" class="lb__btn" id="lbClose" aria-label="Fermer">Fermer ✕</button>
    </div>
    <div class="lb__stage" id="lbStage"><img id="lbImg" alt="" draggable="false"></div>
    <button type="button" class="lb__btn lb__nav lb__nav--prev" id="lbPrev" aria-label="Image précédente"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" shape-rendering="geometricPrecision"><path d="M21 12H3M9.5 5.5 3 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"/></svg></button>
    <button type="button" class="lb__btn lb__nav lb__nav--next" id="lbNext" aria-label="Image suivante"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" shape-rendering="geometricPrecision"><path d="M21 12H3M9.5 5.5 3 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"/></svg></button>
  </div>

  <div class="cursor" id="cursor" aria-hidden="true"></div>

  <script src="projets.js"></script>
  <script src="script.js"></script>
</body>
</html>
